<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>取消车票</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        h1, h2 {
            color: #333;
        }
        .ticket-info {
            background-color: #f5f5f5;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .ticket-info div {
            margin: 10px 0;
        }
        .form-group {
            margin: 15px 0;
        }
        .form-group label {
            display: inline-block;
            width: 100px;
            font-weight: bold;
        }
        .form-group input {
            padding: 8px;
            width: 300px;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
        .error-message {
            color: red;
            margin: 10px 0;
        }
        .success-message {
            color: green;
            margin: 10px 0;
        }
        .countdown {
            font-size: 18px;
            font-weight: bold;
            color: #f44336;
            margin: 20px 0;
        }
        .btn {
            padding: 10px 20px;
            margin-right: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-primary {
            background-color: #4CAF50;
            color: white;
        }
        .btn-secondary {
            background-color: #2196F3;
            color: white;
        }
        .btn-danger {
            background-color: #f44336;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>取消车票</h1>
        
        <!-- 错误消息显示 -->
        <div th:if="${errorMessage != null}" class="error-message">
            <strong>错误:</strong> <span th:text="${errorMessage}"></span>
        </div>
        
        <!-- 成功消息显示 -->
        <div th:if="${successMessage != null}" class="success-message">
            <strong>成功:</strong> <span th:text="${successMessage}"></span>
        </div>
        
        <!-- 倒计时显示 -->
        <div class="countdown">
            剩余时间: <span id="countdownTimer">05:00</span>
        </div>
        
        <!-- 车票信息 -->
        <div class="ticket-info">
            <h2>车票信息</h2>
            <div>
                <strong>车次:</strong> <span th:text="${ticket.train_id}"></span>
            </div>
            <div>
                <strong>始发站:</strong> <span th:text="${ticket.start_station}"></span>
            </div>
            <div>
                <strong>目的地:</strong> <span th:text="${ticket.end_station}"></span>
            </div>
            <div>
                <strong>发车时间:</strong> <span th:text="${ticket.start_time}"></span>
            </div>
            <div>
                <strong>座位系别:</strong> <span th:text="${ticket.seat_type}"></span>
            </div>
            <div>
                <strong>座位号:</strong> <span th:text="${ticket.seat_id}"></span>
            </div>
            <div>
                <strong>乘车人:</strong> <span th:text="${ticket.passenger_name}"></span>
            </div>
        </div>
        
        <!-- 确认取消表单 -->
        <form action="/confirm_cancel" method="post">
            <!-- 隐藏字段，传递车票信息 -->
            <input type="hidden" th:name="train_id" th:value="${ticket.train_id}" />
            <input type="hidden" th:name="start_station" th:value="${ticket.start_station}" />
            <input type="hidden" th:name="end_station" th:value="${ticket.end_station}" />
            <input type="hidden" th:name="start_time" th:value="${ticket.start_time}" />
            <input type="hidden" th:name="seat_type" th:value="${ticket.seat_type}" />
            <input type="hidden" th:name="seat_id" th:value="${ticket.seat_id}" />
            <input type="hidden" th:name="passenger_name" th:value="${ticket.passenger_name}" />
            <input type="hidden" th:name="id_card" th:value="${ticket.id_card}" />
            
            <!-- 身份验证 -->
            <div class="form-group">
                <label for="verifyIdCard">身份证号:</label>
                <input type="text" id="verifyIdCard" name="verify_id_card" required placeholder="请输入身份证号" />
            </div>
            
            <div class="form-group">
                <label for="verifyTelephone">手机号:</label>
                <input type="text" id="verifyTelephone" name="verify_telephone" required placeholder="请输入手机号" />
            </div>
            
            <!-- 按钮 -->
            <div>
                <button type="submit" class="btn btn-danger">确认取消</button>
                <button type="button" class="btn btn-secondary" onclick="history.back()">返回</button>
            </div>
        </form>
    </div>
    
    <script>
        // 倒计时功能
        let countdownTime = 5 * 60; // 5分钟，单位秒
        
        function updateCountdown() {
            const minutes = Math.floor(countdownTime / 60);
            const seconds = countdownTime % 60;
            const formattedTime = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById('countdownTimer').textContent = formattedTime;
            
            if (countdownTime <= 0) {
                // 倒计时结束，跳回订单页面
                window.location.href = '/order';
            } else {
                countdownTime--;
                setTimeout(updateCountdown, 1000);
            }
        }
        
        // 页面加载时启动倒计时
        window.onload = function() {
            updateCountdown();
        };
    </script>
</body>
</html>
